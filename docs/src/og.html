<!doctype html>
<!-- OG 画像（1200×630）の元。scripts/render-og.sh で docs/og-en.png / og-ja.png に書き出す -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@500;600&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #EEF1F5; color: #14213D; font-family: "IBM Plex Sans", "IBM Plex Sans JP", sans-serif; position: relative; }
  .brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 600; }
  .brand img { width: 72px; height: 72px; }
  h1 { position: absolute; left: 72px; top: 190px; width: 560px; margin: 0; font-size: 60px; line-height: 1.08; letter-spacing: -0.02em; font-weight: 600; }
  .ja h1 { font-size: 52px; line-height: 1.25; letter-spacing: 0; white-space: pre-line; top: 170px; }
  p { position: absolute; left: 72px; bottom: 64px; margin: 0; font-size: 26px; color: #556074; }
  .mac { position: absolute; left: 640px; top: 150px; width: 400px; height: 250px; border: 10px solid #1B2640; border-radius: 16px 16px 6px 6px; background: linear-gradient(170deg, #5E86F0, #2C4FD8); }
  .base { position: absolute; left: 626px; top: 418px; width: 448px; height: 14px; border-radius: 0 0 12px 12px; background: #A9B3C4; }
  .droid { position: absolute; left: 1000px; top: 220px; width: 150px; height: 220px; border: 9px solid #1B2640; border-radius: 22px; background: linear-gradient(170deg, #5E86F0, #2C4FD8); }
  .win { position: absolute; background: #F7F9FC; border-radius: 8px; box-shadow: 0 12px 24px -12px rgba(0,0,0,.4); }
  .win::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 16%; background: #E4E9F1; border-radius: 8px 8px 0 0; }
  .mac .win { left: 34px; top: 36px; width: 190px; height: 140px; }
  .droid .win { left: 14px; top: 40px; width: 104px; height: 90px; }
</style></head>
<body>
  <div class="brand"><img src="../icon.png" alt="">Annex</div>
  <h1 id="h"></h1>
  <p id="p"></p>
  <div class="mac"><div class="win"></div></div><div class="base"></div>
  <div class="droid"><div class="win"></div></div>
<script>
  var ja = location.search.indexOf("lang=ja") >= 0;
  if (ja) document.body.className = "ja";
  document.getElementById("h").textContent = ja ? "Android を、\nMac の\nサブディスプレイに。" : "Your Android, as a second monitor for your Mac.";
  document.getElementById("p").textContent = ja ? "無料・オープンソース ／ USB でも Wi-Fi でも" : "Free and open source · USB or Wi-Fi";
</script>
</body></html>
